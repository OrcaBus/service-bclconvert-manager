allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true

ignoredBuiltDependencies:
  - unrs-resolver

minimumReleaseAgeExclude:
  - js-yaml@3.15.0 || 3.15.1 || 3.15.2
  - browserslist@4.28.7
  - baseline-browser-mapping@2.11.0

# deepmerge advisory GHSA-gcqx-w48m-w2h4 (low): no fixed version published upstream
# (latest is 4.3.1, advisory names 4.3.2 which does not exist). Ignored until a fix ships.
# Only reaches the tree via jest (devDependency), not shipped code.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

overrides:
  ajv@<6.14.0: '>=6.14.0'
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  browserslist@<=4.28.6: ^4.28.7
  diff@>=4.0.0 <4.0.4: '>=4.0.4'
  js-yaml@<3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  minimatch@<10.2.1: '>=10.2.1'
